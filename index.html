<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRA Network — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">K</div>
    <div class="brand-name">KIRA Network — Admin</div>
  </div>
  <div class="conn">
    <span class="dot" id="connDot"></span>
    <span id="connLabel">connecting…</span>
  </div>
</div>

<div class="wrap">

  <div class="setup-note" id="setupNote">
    Supabase credentials aren't set yet. Open kira-admin.html and fill in SUPABASE_URL and SUPABASE_SERVICE_KEY near the top of the script.
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Sessions</div><div class="stat-value" id="statSessions">0</div></div>
    <div class="stat"><div class="stat-label">Events</div><div class="stat-value" id="statEvents">0</div></div>
    <div class="stat"><div class="stat-label">Granted</div><div class="stat-value granted" id="statGranted">0</div></div>
    <div class="stat"><div class="stat-label">Denied</div><div class="stat-value denied" id="statDenied">0</div></div>
    <div class="stat"><div class="stat-label">Consents signed</div><div class="stat-value" id="statConsents">0</div></div>
  </div>

  <div class="section-title">Live feed</div>
  <div class="feed" id="feed">
    <div class="empty">Waiting for activity from kira-permissions.html…</div>
  </div>

</div>

<script src="js/script.js"></script>
</body>
</html>
